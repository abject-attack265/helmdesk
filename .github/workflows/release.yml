name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build Linux binaries
        env:
          APP_COMMIT: ${{ github.sha }}
        run: APP_VERSION="${GITHUB_REF_NAME#v}" ./build/linux.sh -p "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: helmdesk-linux-${{ matrix.arch }}
          path: build/output/helmdesk-linux-${{ matrix.arch }}
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Windows installer
        shell: pwsh
        run: ./build/windows.ps1 -AppVersion ('${{ github.ref_name }}'.TrimStart('v'))
      - uses: actions/upload-artifact@v4
        with:
          name: helmdesk-windows
          path: |
            build/output/HelmDesk-Setup.exe
            build/output/helmdesk-windows-amd64.zip
          if-no-files-found: error

  image:
    needs:
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: helmdesk-linux-*
          path: build/output
          merge-multiple: true
      - name: Restore executable permissions
        run: chmod +x build/output/helmdesk-linux-*
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
      - name: Build and push multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish:
    needs:
      - image
      - linux
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: helmdesk-linux-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: helmdesk-windows
          path: release-assets
          merge-multiple: true
      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-assets/*
      - name: Publish immutable-ready release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use v<major>.<minor>.<patch>: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" release-assets/*
          gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
